[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structura-geo"
version = "0.1.0"
description = "Minecraft structure geometry, room and material metrics, and placement preparation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["structura-core>=0.6.1,<0.7", "numpy>=1.26,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
legacy = ["structura-core[legacy]>=0.6.1,<0.7"]
test = ["pytest>=8,<9", "ruff"]

[project.scripts]
structura-analyze = "structura_geo.analyze:main"
structura-check-doors = "structura_geo.check_doors:main"
structura-check-leaks = "structura_geo.check_leaks:main"
structura-prepare-legacy = "structura_geo.convert_legacy:main"

[project.urls]
Repository = "https://github.com/kirimba1024/structura-geo"
Documentation = "https://github.com/kirimba1024/structura-geo#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structura_geo = ["py.typed"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
